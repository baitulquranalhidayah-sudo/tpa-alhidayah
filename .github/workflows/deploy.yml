name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Bersihkan berkas pengembangan
        run: rm -rf node_modules src tools .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # deploy-pages mencari artifact lewat API. Beri waktu agar indeksnya
      # siap; tanpa jeda ini kadang "No artifacts named github-pages found".
      - name: Tunggu indeks artifact
        run: sleep 15

      - id: deployment
        uses: actions/deploy-pages@v4
